<!DOCTYPE html>
<html>
<head>
    <title>Quotation and Citation</title>
</head>
<body>

    <h2>Quotation Elements</h2>

    <blockquote>
        The best way to predict the future is to create it.
    </blockquote>

    <p>
        He said, <q>Practice makes a man perfect.</q>
    </p>

    <h2>Citation</h2>

    <p>
        My favourite book is
        <cite>The Alchemist</cite>.
    </p>

    <h2>Abbreviation</h2>

    <p>
        <abbr title="World Wide Web Consortium">W3C</abbr>
        develops web standards.
    </p>

    <h2>Address</h2>

    <address>
        Contact: College Administration<br>
        New Delhi, India
    </address>

</body>
</html>
