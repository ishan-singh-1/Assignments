<!DOCTYPE html>
<html>
<head>
    <title>Student Marks Table</title>

    <style>
        table {
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
        }
    </style>
</head>
<body>

    <table>

        <caption>Student Marks</caption>

        <thead>
            <tr>
                <th>Roll No.</th>
                <th>Name</th>
                <th>Marks</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>1</td>
                <td>Rahul</td>
                <td>85</td>
            </tr>

            <tr>
                <td>2</td>
                <td>Aman</td>
                <td>90</td>
            </tr>

            <tr>
                <td>3</td>
                <td>Priya</td>
                <td>95</td>
            </tr>
        </tbody>

        <tfoot>
            <tr>
                <td colspan="2">Total Marks</td>
                <td>270</td>
            </tr>
        </tfoot>

    </table>

</body>
</html>
