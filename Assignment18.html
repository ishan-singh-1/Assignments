<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Admission Page</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        header {
            background-color: navy;
            color: white;
            text-align: center;
            padding: 15px;
        }

        main {
            width: 80%;
            margin: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
            text-align: left;
        }

        fieldset {
            margin-top: 20px;
            padding: 15px;
        }

        label {
            display: block;
            margin-top: 10px;
        }

        footer {
            background-color: navy;
            color: white;
            text-align: center;
            padding: 10px;
            margin-top: 20px;
        }

    </style>

</head>

<body>

    <header>

        <h1>ABC College</h1>
        <h2>Student Admission 2026</h2>

    </header>

    <main>

        <h2>Available Courses</h2>

        <table>

            <caption>Course Details</caption>

            <tr>
                <th>Course</th>
                <th>Seats</th>
                <th>Fees</th>
            </tr>

            <tr>
                <td>B.Tech CSE</td>
                <td>120</td>
                <td>90000</td>
            </tr>

            <tr>
                <td>BCA</td>
                <td>60</td>
                <td>40000</td>
            </tr>

        </table>

        <h2>Admission Form</h2>

        <form action="#" method="post">

            <fieldset>

                <legend>Student Information</legend>

                <label for="name">Full Name:</label>

                <input type="text"
                       id="name"
                       name="name"
                       required>

                <label for="email">Email:</label>

                <input type="email"
                       id="email"
                       name="email"
                       required>

                <label for="course">Select Course:</label>

                <select id="course" name="course" required>

                    <option value="">Select Course</option>
                    <option value="B.Tech CSE">B.Tech CSE</option>
                    <option value="BCA">BCA</option>

                </select>

                <label for="statement">Why do you want to join?</label>

                <textarea id="statement"
                          name="statement"
                          rows="4"
                          required></textarea>

                <br><br>

                <button type="submit">Submit Application</button>

            </fieldset>

        </form>

    </main>

    <footer>

        <p>Copyright 2026 ABC College</p>

    </footer>

</body>

</html>
