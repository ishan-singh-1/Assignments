<!DOCTYPE html>
<html>
<head>
    <title>Class Timetable</title>

    <style>
        table {
            border-collapse: collapse;
            width: 60%;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }
    </style>
</head>
<body>

    <h2>Class Timetable</h2>

    <table>

        <tr>
            <th>Day</th>
            <th>9-10 AM</th>
            <th>10-11 AM</th>
            <th>11-12 PM</th>
        </tr>

        <tr>
            <th>Monday</th>
            <td>Maths</td>
            <td>Physics</td>
            <td rowspan="2">Web Designing Lab</td>
        </tr>

        <tr>
            <th>Tuesday</th>
            <td>English</td>
            <td>Computer</td>
        </tr>

        <tr>
            <th>Wednesday</th>
            <td colspan="3">Seminar</td>
        </tr>

    </table>

</body>
</html>
