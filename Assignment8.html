<!DOCTYPE html>
<html>
<head>
    <title>Hyperlinks and Images</title>
</head>
<body>

    <h2>Hyperlinks</h2>

    <p>
        <a href="https://www.google.com" target="_blank">
            Visit Google
        </a>
    </p>

    <p>
        <a href="#bottom">Go to Bottom</a>
    </p>

    <p>
        <a href="mailto:student@gmail.com">
            Send Email
        </a>
    </p>

    <h2>Image Link</h2>

    <a href="https://www.google.com" target="_blank">
        <img src="logo.jpg" alt="Google Logo" width="100">
    </a>

    <div style="height: 400px;"></div>

    <p id="bottom">You have reached the bottom.</p>

    <a href="#">Back to Top</a>

</body>
</html>
