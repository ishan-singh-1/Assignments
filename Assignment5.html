<!DOCTYPE html>
<html>
<head>
    <title>HTML Lists</title>
</head>
<body>

    <h3>Unordered List</h3>

    <ul>
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
    </ul>

    <h3>Ordered List</h3>

    <ol type="A">
        <li>Install VS Code</li>
        <li>Create HTML File</li>
        <li>Open in Browser</li>
    </ol>

    <h3>Description List</h3>

    <dl>
        <dt>HTML</dt>
        <dd>HyperText Markup Language</dd>

        <dt>CSS</dt>
        <dd>Cascading Style Sheets</dd>

    </dl>

</body>
</html>
