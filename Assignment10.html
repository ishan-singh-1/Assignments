<!DOCTYPE html>
<html>
<head>
    <title>Multimedia in HTML</title>
</head>
<body>

    <h2>Image</h2>

    <img src="image.jpg"
         alt="Sample Image"
         width="300">

    <h2>Video</h2>

    <video width="300" controls>
        <source src="video.mp4" type="video/mp4">
    </video>

    <h2>Audio</h2>

    <audio controls>
        <source src="audio.mp3" type="audio/mpeg">
    </audio>

    <h2>YouTube Video</h2>

    <iframe width="400"
            height="250"
            src="https://www.youtube.com/embed/ysz5S6PUM-U"
            allowfullscreen>
    </iframe>

</body>
</html>
